name: Depot Xcode compilation cache
description: Summarize the Xcode (26+) compilation cache on Depot macOS runners at the end of a job
author: Depot
branding:
  icon: package
  color: gray-dark
runs:
  using: node24
  main: dist/index.js
  post: dist/post.js
inputs:
  debug:
    description: |-
      Enables detailed logging, and lists the keys that missed the cache.
    default: false
    required: false
